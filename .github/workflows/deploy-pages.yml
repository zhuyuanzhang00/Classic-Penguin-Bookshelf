name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: |
          set -euo pipefail
          assemble_lockfile() {
            if [ -d lockfile-parts ]; then
              echo "Assembling package-lock.json from lockfile-parts"
              cat lockfile-parts/part-* > package-lock.json
            fi
          }
          is_valid_lockfile() {
            node -e "
              const fs = require('fs');
              if (!fs.existsSync('package-lock.json')) process.exit(1);
              const text = fs.readFileSync('package-lock.json', 'utf8');
              if (!text.trim() || text.includes('PLACEHOLDER_TOO_LARGE')) process.exit(1);
              const parsed = JSON.parse(text);
              if (!parsed.lockfileVersion || !parsed.packages) process.exit(1);
            "
          }
          if ! is_valid_lockfile; then
            assemble_lockfile
          fi
          if is_valid_lockfile; then
            echo "Using npm ci"
            npm ci
          else
            echo "Lockfile missing or invalid; using npm install"
            npm install
          fi
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
